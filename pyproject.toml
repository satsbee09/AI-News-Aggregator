[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "AI News Aggregator application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "feedparser>=6.0.14",
    "google-genai>=2.22.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.1",
    "langgraph>=1.2.11",
    "motor>=3.7.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "pytz>=2026.3.post1",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "youtube-transcript-api>=1.2.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

